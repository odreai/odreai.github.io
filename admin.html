<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>안심365 관리자</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f1eb;color:#1d2633;font-family:Arial,"Noto Sans KR",sans-serif}
    button,input{font:inherit}
    .wrap{max-width:1180px;margin:auto;padding:22px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
    .brand h1{margin:0;font-size:26px}.brand p{margin:6px 0 0;color:#68717d;font-size:14px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    button.active,.primary{background:#0f243e;color:#fff}
    .login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
    .login h2{margin-top:0}.login input{width:100%;padding:14px;border:1px solid #ccd1d7;border-radius:10px;margin:12px 0}
    .login button{width:100%;background:#7a1010;color:#fff;font-weight:700}
    .error{color:#a40000;font-size:14px;min-height:20px}
    .hidden{display:none!important}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .card,.panel{background:#fff;border-radius:16px;box-shadow:0 5px 18px rgba(0,0,0,.06)}
    .card{padding:20px}.card .label{font-size:14px;color:#68717d}.card .value{font-size:32px;font-weight:800;margin-top:8px}.card small{color:#8a929c}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .panel{padding:20px}.panel h3{margin:0 0 16px;font-size:18px}
    .bar-row{display:grid;grid-template-columns:90px 1fr 46px;align-items:center;gap:10px;margin:11px 0;font-size:14px}
    .bar{height:12px;background:#eceff3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#0f243e;border-radius:99px}
    .daily{display:flex;align-items:flex-end;gap:8px;min-height:170px;overflow-x:auto;padding-top:12px}
    .day{min-width:52px;text-align:center}.columns{height:125px;display:flex;gap:4px;align-items:flex-end;justify-content:center}.col{width:16px;border-radius:5px 5px 0 0;background:#0f243e;min-height:2px}.col.consult{background:#7a1010}.day span{display:block;font-size:11px;color:#707985;margin-top:7px}
    .table-wrap{overflow:auto}.full{margin-bottom:16px}
    table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{padding:11px 10px;border-bottom:1px solid #edf0f2;text-align:left}th{color:#68717d;background:#fafbfc;position:sticky;top:0}td.wraptext{white-space:normal;min-width:180px}
    .badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf1f5;font-size:12px}.badge.red{background:#fae7e7;color:#7a1010}
    .status{font-size:13px;color:#68717d}.legend{font-size:12px;color:#68717d;margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#0f243e;margin-right:4px}.dot.red{background:#7a1010;margin-left:12px}
    @media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.card .value{font-size:26px}}
  </style>
</head>
<body>
  <div id="loginBox" class="login">
    <h2>안심365 관리자</h2>
    <p>관리자 비밀번호를 입력하세요.</p>
    <input id="adminKey" type="password" autocomplete="current-password" placeholder="관리자 비밀번호">
    <button id="loginBtn">관리자 페이지 열기</button>
    <p id="loginError" class="error"></p>
  </div>

  <main id="dashboard" class="wrap hidden">
    <div class="top">
      <div class="brand"><h1>안심365 운영 현황</h1><p id="updatedAt">불러오는 중</p></div>
      <div class="actions">
        <button data-days="1" class="active">오늘</button>
        <button data-days="7">7일</button>
        <button data-days="30">30일</button>
        <button id="refreshBtn" class="primary">새로고침</button>
        <button id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <section class="cards">
      <div class="card"><div class="label">방문 횟수</div><div id="visits" class="value">0</div><small>새로고침 포함</small></div>
      <div class="card"><div class="label">고유 방문자</div><div id="unique" class="value">0</div><small>IP 기준</small></div>
      <div class="card"><div class="label">상담 접수</div><div id="consultations" class="value">0</div><small>중복 제외 저장 건수</small></div>
      <div class="card"><div class="label">전환율</div><div id="conversion" class="value">0%</div><small>상담 ÷ 방문</small></div>
    </section>

    <section class="grid">
      <div class="panel"><h3>유입 경로</h3><div id="sources"></div></div>
      <div class="panel"><h3>접속 기기</h3><div id="devices"></div></div>
    </section>

    <section class="panel full">
      <h3>날짜별 추이</h3>
      <div id="daily" class="daily"></div>
      <div class="legend"><span class="dot"></span>방문 <span class="dot red"></span>상담</div>
    </section>

    <section class="panel full">
      <h3>최근 상담 접수</h3>
      <div class="table-wrap"><table><thead><tr><th>시간</th><th>보호자</th><th>연락처</th><th>임종상태</th><th>장례형태</th><th>위치</th><th>SMS</th></tr></thead><tbody id="consultTable"></tbody></table></div>
    </section>

    <section class="panel full">
      <h3>최근 방문 기록</h3>
      <div class="table-wrap"><table><thead><tr><th>시간</th><th>유입</th><th>기기</th><th>페이지</th><th>IP</th><th>화면</th></tr></thead><tbody id="visitTable"></tbody></table></div>
    </section>
    <p id="status" class="status"></p>
  </main>

<script>
const API = "https://www.odreai.com/api/admin/stats";
let currentDays = 1;
let timer = null;
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function key(){ return sessionStorage.getItem("ansim365AdminKey") || ""; }
function formatTime(value){ if(!value) return "-"; try{return new Date(value).toLocaleString("ko-KR");}catch{return value;} }

async function loadStats(){
  $("status").textContent = "통계를 불러오는 중입니다.";
  const response = await fetch(`${API}?days=${currentDays}`, {headers:{"X-Admin-Key":key(),"Accept":"application/json"}});
  let data = null; try{ data = await response.json(); }catch{}
  if(response.status === 401 || response.status === 503) throw new Error(data?.detail || "관리자 인증 실패");
  if(!response.ok) throw new Error(data?.detail || "통계 조회 실패");
  render(data);
}

function bars(target, obj){
  const entries = Object.entries(obj || {}).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(1, ...entries.map(x=>x[1]));
  $(target).innerHTML = entries.length ? entries.map(([name,count]) => `<div class="bar-row"><span>${esc(name)}</span><div class="bar"><i style="width:${count/max*100}%"></i></div><b>${count}</b></div>`).join("") : "<p>기록 없음</p>";
}

function render(data){
  $("visits").textContent = data.summary.visits.toLocaleString();
  $("unique").textContent = data.summary.unique_visitors.toLocaleString();
  $("consultations").textContent = data.summary.consultations.toLocaleString();
  $("conversion").textContent = `${data.summary.conversion_rate}%`;
  $("updatedAt").textContent = `최종 갱신 ${formatTime(data.generated_at)} · ${data.days}일 기준`;
  bars("sources", data.sources); bars("devices", data.devices);

  const max = Math.max(1, ...data.daily.flatMap(d=>[d.visits,d.consultations]));
  $("daily").innerHTML = data.daily.map(d => `<div class="day"><div class="columns"><i class="col" title="방문 ${d.visits}" style="height:${Math.max(2,d.visits/max*120)}px"></i><i class="col consult" title="상담 ${d.consultations}" style="height:${Math.max(2,d.consultations/max*120)}px"></i></div><span>${esc(d.date.slice(5))}</span></div>`).join("");

  $("consultTable").innerHTML = data.recent_consultations.length ? data.recent_consultations.map(r => `<tr><td>${esc(formatTime(r.received_at))}</td><td>${esc(r.guardian_name || "-")}</td><td><b>${esc(r.phone || "-")}</b></td><td>${esc(r.death_status || "-")}</td><td><span class="badge red">${esc(r.funeral_type || "-")}</span></td><td class="wraptext">${esc(r.address || "-")}</td><td>${esc(r.sms_status || "-")}</td></tr>`).join("") : '<tr><td colspan="7">상담 기록 없음</td></tr>';

  $("visitTable").innerHTML = data.recent_visits.length ? data.recent_visits.map(r => `<tr><td>${esc(formatTime(r.server_time))}</td><td><span class="badge">${esc(r.source)}</span></td><td>${esc(r.device)}</td><td>${esc(r.page || "-")}</td><td>${esc(r.ip || "-")}</td><td>${esc(r.screen || "-")}</td></tr>`).join("") : '<tr><td colspan="6">방문 기록 없음</td></tr>';
  $("status").textContent = "60초마다 자동 갱신됩니다.";
}

async function login(){
  const value = $("adminKey").value.trim();
  if(!value){ $("loginError").textContent = "비밀번호를 입력하세요."; return; }
  sessionStorage.setItem("ansim365AdminKey", value);
  try{
    await loadStats();
    $("loginBox").classList.add("hidden"); $("dashboard").classList.remove("hidden");
    timer = setInterval(()=>loadStats().catch(e=>$("status").textContent=e.message), 60000);
  }catch(e){ sessionStorage.removeItem("ansim365AdminKey"); $("loginError").textContent=e.message; }
}

$("loginBtn").onclick = login;
$("adminKey").addEventListener("keydown", e=>{if(e.key==="Enter") login();});
$("refreshBtn").onclick = ()=>loadStats().catch(e=>$("status").textContent=e.message);
$("logoutBtn").onclick = ()=>{sessionStorage.removeItem("ansim365AdminKey"); location.reload();};
document.querySelectorAll("[data-days]").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("[data-days]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentDays=Number(btn.dataset.days);loadStats().catch(e=>$("status").textContent=e.message);});

if(key()) login();
</script>
</body>
</html>
