<script>

/* =========================================
   체류시간 표시
========================================= */

function formatDuration(seconds){

    seconds = Number(seconds || 0);

    if(seconds <= 0){
        return "-";
    }

    if(seconds < 60){
        return `${seconds}초`;
    }

    const min =
        Math.floor(seconds / 60);

    const sec =
        seconds % 60;

    return `${min}분 ${String(sec).padStart(2,"0")}초`;
}


/* =========================================
   체류시간 CSS 클래스
========================================= */

function durationClass(seconds){

    seconds =
        Number(seconds || 0);

    if(seconds <= 0){
        return "";
    }

    if(seconds < 10){
        return "short";
    }

    if(seconds >= 60){
        return "long";
    }

    return "";
}


/* =========================================
   안전한 HTML 출력
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================
   유입 표시 정리
========================================= */

function getSourceName(v){

    if(v.source){
        return v.source;
    }

    const ref =
        String(v.referrer || "").toLowerCase();

    if(ref.includes("naver")){
        return "네이버";
    }

    if(ref.includes("google")){
        return "구글";
    }

    if(ref.includes("daum")){
        return "다음";
    }

    if(ref.includes("kakao")){
        return "카카오";
    }

    if(ref){
        return "외부";
    }

    return "직접";
}


/* =========================================
   방문기록 렌더링
========================================= */

function renderVisits(visits){

    const tbody =
        document.getElementById("visitTable");

    if(!tbody){
        return;
    }

    tbody.innerHTML = "";


    if(!Array.isArray(visits) || visits.length === 0){

        tbody.innerHTML = `

            <tr>

                <td colspan="9"
                    style="
                        text-align:center;
                        padding:28px;
                        color:#8a94a3;
                    ">

                    방문 기록이 없습니다.

                </td>

            </tr>

        `;

        return;
    }


    visits.forEach(v => {

        const tr =
            document.createElement("tr");


        const duration =
            Number(v.duration || v.durationSeconds || 0);


        const source =
            getSourceName(v);


        const ad =
            v.ad ||
            v.adType ||
            v.campaign ||
            "";


        const keyword =
            v.keyword ||
            v.searchKeyword ||
            v.query ||
            "";


        const device =
            v.device ||
            "-";


        const page =
            v.page ||
            "/";


        const ip =
            v.ip ||
            "-";


        const screen =
            v.screen ||
            "-";


        const time =
            v.time ||
            v.visitedAt ||
            "-";


        tr.innerHTML = `

            <td>
                ${escapeHtml(time)}
            </td>


            <td>
                <span class="visit-source">
                    ${escapeHtml(source)}
                </span>
            </td>


            <td>

                ${
                    ad

                    ? `<span class="visit-ad">
                        ${escapeHtml(ad)}
                       </span>`

                    : "-"
                }

            </td>


            <td
                class="visit-keyword"
                title="${escapeHtml(keyword)}"
            >

                ${keyword
                    ? escapeHtml(keyword)
                    : "-"
                }

            </td>


            <td>
                ${escapeHtml(device)}
            </td>


            <td>
                ${escapeHtml(page)}
            </td>


            <td>

                <span class="
                    visit-duration
                    ${durationClass(duration)}
                ">

                    ${formatDuration(duration)}

                </span>

            </td>


            <td>
                ${escapeHtml(ip)}
            </td>


            <td>
                ${escapeHtml(screen)}
            </td>

        `;


        tbody.appendChild(tr);

    });

}


/* =========================================
   체류시간 측정
========================================= */

const visitPageStartedAt =
    Date.now();


function getCurrentVisitDuration(){

    return Math.max(

        1,

        Math.floor(
            (Date.now() - visitPageStartedAt) / 1000
        )

    );

}


/* =========================================
   URL 광고정보 추출
========================================= */

function getTrafficParams(){

    const params =
        new URLSearchParams(
            location.search
        );


    return {

        utmSource:
            params.get("utm_source") || "",

        utmMedium:
            params.get("utm_medium") || "",

        utmCampaign:
            params.get("utm_campaign") || "",

        keyword:
            params.get("utm_term") ||
            params.get("keyword") ||
            params.get("query") ||
            "",

        ad:
            params.get("utm_medium") === "cpc"
            ? "파워링크"
            : ""

    };

}


/* =========================================
   페이지 종료 시 체류시간 전송
========================================= */

function sendVisitDuration(){

    const traffic =
        getTrafficParams();


    const payload = {

        page:
            location.pathname,

        referrer:
            document.referrer || "",

        duration:
            getCurrentVisitDuration(),

        keyword:
            traffic.keyword,

        ad:
            traffic.ad,

        utmSource:
            traffic.utmSource,

        utmMedium:
            traffic.utmMedium,

        utmCampaign:
            traffic.utmCampaign

    };


    const body =
        JSON.stringify(payload);


    try{

        navigator.sendBeacon(

            "https://api.odreai.kr/api/visit-duration",

            new Blob(

                [body],

                {
                    type:"application/json"
                }

            )

        );

    }catch(e){

        /* 종료 시 오류는 무시 */

    }

}


window.addEventListener(
    "pagehide",
    sendVisitDuration
);

</script>
